[project]
name = "wayfinder"
version = "0.1.0"
description = "Mac-orchestrated semantic interface for Wayfinder, with USB adapters for DevKitC-1, BOX-3, and P4X-EYE."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "playwright>=1.49"]
serial = ["pyserial>=3.5"]
fetch = ["uagents>=0.15"]
sentry = ["sentry-sdk>=2"]

[project.scripts]
wayfinder = "wayfinder.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
