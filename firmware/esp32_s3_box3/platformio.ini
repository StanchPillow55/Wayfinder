; Wayfinder ESP32-S3-BOX-3 adapter SCAFFOLD. SOURCE ONLY until a board enumerates.
; Speaks the Mac envelope. Draws nothing, hears nothing, speaks nothing.
;
; UNVERIFIED and to be checked at the bench:
;   - `board` below. Run `pio boards box` and pick the BOX-3 entry if one exists.
;     If none does, use esp32-s3-devkitc-1 with the BOX-3 flash size and write
;     down what worked in docs/hardware/sprint.md.
;   - USB CDC on boot. The BOX-3 USB-C on the main unit is expected to be the
;     ESP32-S3 native USB. That is why CDC is on here, unlike the DevKit.
;   - 16 MB flash and the partition table are not set here.
;
; Do not hardcode an upload port. Pass the one found at the bench:
;   pio run -t upload --upload-port "$WAYFINDER_BOX3_PORT"

[env:box3_scaffold]
platform = espressif32
board = esp32s3box
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
