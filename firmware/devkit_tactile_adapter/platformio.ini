; Wayfinder DevKitC-1 tactile adapter.
; USB serial to the Mac only. This board does not speak UART to an ESP32-C3.
; Servo signal: GPIO 18. That pin is unverified until the physical board is checked.
; Power the servo from the external 5 V pack through the driver. Share ground.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
