; Wayfinder DevKitC-1 tactile adapter. SOURCE ONLY until a board enumerates.
; USB serial to the Mac only. This board does not speak UART to an ESP32-C3.
;
; Two environments. Flash the health-only one first.
;   devkit_health_only  never configures the signal pin. Safe with nothing wired.
;   devkit_motor_bench  drives the signal pin. Do not flash it until the meter
;                       checks in docs/hardware/sprint.md are done and a typed
;                       health ACK has come from devkit_health_only.
;
; Signal pin GPIO 18 is an unverified software assumption. The driver, motor
; voltage, and signal style are unknown. Power the motor from an external
; supply with a shared ground, never from the DevKit 5V or 3V3 pin.
;
; Do not hardcode an upload port here. Pass the port found at the bench:
;   pio run -e devkit_health_only -t upload --upload-port "$WAYFINDER_DEVKIT_PORT"

[platformio]
default_envs = devkit_health_only

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0

[env:devkit_health_only]
build_flags =
  ${env.build_flags}
  -DWAYFINDER_MOTOR_ENABLE=0

[env:devkit_motor_bench]
build_flags =
  ${env.build_flags}
  -DWAYFINDER_MOTOR_ENABLE=1
