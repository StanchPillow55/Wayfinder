<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product (local mirror)</title>
</head>
<body data-wf-mirror="commerce">
  <main>
    <h1 id="title">Product</h1>
    <p id="blurb"></p>
    <p id="status" role="status"></p>
    <ul>
      <li data-wf-item id="detail"><h2 id="name"></h2><p id="price"></p><button type="button" id="add"></button></li>
    </ul>
    <p><a href="shop.html">Back to the shop</a></p>
    <p><a href="shop-cart.html">Review cart and checkout</a></p>
  </main>
  <script src="shop.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    const product = WF_PRODUCTS[id];
    if (product) {
      document.title = `${product.name} (local mirror)`;
      document.querySelector("#title").textContent = product.name;
      document.querySelector("#blurb").textContent = product.blurb;
      document.querySelector("#detail").dataset.name = product.name;
      document.querySelector("#name").textContent = product.name;
      document.querySelector("#price").textContent = `$${product.price}. ${product.blurb}`;
      const add = document.querySelector("#add");
      add.textContent = `Add ${product.name} to cart`;
      add.dataset.add = id;
      add.addEventListener("click", () => {
        const cart = wfCart();
        cart.push(id);
        wfSave(cart);
        document.querySelector("#status").textContent = `Added ${product.name} to cart. ${wfCartLine()}`;
      });
      document.querySelector("#status").textContent = wfCartLine();
    } else {
      document.querySelector("#title").textContent = "Product not found";
      document.querySelector("#add").hidden = true;
    }
  </script>
</body>
</html>
