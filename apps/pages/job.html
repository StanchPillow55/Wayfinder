<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Role (local mirror)</title>
</head>
<body data-wf-mirror="jobs">
  <main>
    <h1 id="title">Role</h1>
    <p id="about"></p>
    <ul>
      <li data-wf-item id="detail"><h2 id="place"></h2><p id="needs"></p></li>
    </ul>
    <p><a id="apply" href="jobs.html">Start application</a></p>
    <p><a href="jobs.html">Back to all roles</a></p>
  </main>
  <script src="jobs.js"></script>
  <script>
    const id = new URLSearchParams(location.search).get("id");
    const role = WF_ROLES[id];
    if (role) {
      document.title = `${role.title} (local mirror)`;
      document.querySelector("#title").textContent = role.title;
      document.querySelector("#about").textContent = role.about;
      document.querySelector("#detail").dataset.name = role.title;
      document.querySelector("#place").textContent = `${role.place}. ${role.pay}`;
      document.querySelector("#needs").textContent = `What it asks for: ${role.needs}`;
      document.querySelector("#apply").href = `jobs-apply.html?id=${encodeURIComponent(id)}`;
    } else {
      document.querySelector("#title").textContent = "Role not found";
      document.querySelector("#apply").hidden = true;
    }
  </script>
</body>
</html>
